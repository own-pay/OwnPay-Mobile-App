org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# mobile_scanner: use the UNBUNDLED ML Kit barcode model (delivered & maintained by Google Play
# Services) instead of the model bundled into the APK. The bundled model's BarcodeScanning.getClient()
# was failing to initialize on-device (native NPE → camera never opened). The unbundled variant is
# more device-compatible and also shrinks the APK. QR detection still runs 100% on-device; the only
# external step is a one-time Play-Services model fetch (see the DEPENDENCIES meta-data in the
# manifest). Requires Google Play Services (already assumed — the app ships on Play). See
# mobile-app/docs/ROADMAP.md (ML Kit delivery decision).
dev.steenbakker.mobile_scanner.useUnbundled=true
